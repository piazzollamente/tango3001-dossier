      const lightboxImage = document.getElementById('lightbox-image');
      const lightboxDate = document.getElementById('lightbox-date');
      const lightboxCounter = document.getElementById('lightbox-counter');
      const lightboxPrev = document.getElementById('lightbox-prev');
      const lightboxNext = document.getElementById('lightbox-next');
      const lightboxClose = document.getElementById('lightbox-close');
      const lightboxStage = document.getElementById('lightbox-stage');
      let currentIndex = 0;
      let lastFocus = null;
      let touchStartX = 0;

      const renderLightbox = () => {
        const link = galleryLinks[currentIndex];
        const figure = link.closest('.gallery-item');
        const sourceImage = link.querySelector('img');
        lightboxImage.src = link.href;
        lightboxImage.alt = sourceImage.alt || 'Imagen del archivo visual de Piazzollamente';
        lightboxDate.textContent = figure.dataset.date || 'Fecha por verificar';
        lightboxCounter.textContent = `${currentIndex + 1} / ${galleryLinks.length}`;
        lightboxPrev.disabled = currentIndex === 0;
        lightboxNext.disabled = currentIndex === galleryLinks.length - 1;

        [currentIndex - 1, currentIndex + 1].forEach((index) => {
          if (index >= 0 && index < galleryLinks.length) {
            const preload = new Image();
            preload.src = galleryLinks[index].href;
          }
        });
      };

      const openLightbox = (index) => {
        currentIndex = index;
        lastFocus = document.activeElement;
        renderLightbox();
        lightbox.hidden = false;
        lightbox.setAttribute('aria-hidden', 'false');
        document.body.classList.add('lightbox-open');
        requestAnimationFrame(() => lightboxClose.focus());
      };

      const closeLightbox = () => {
        lightbox.hidden = true;
        lightbox.setAttribute('aria-hidden', 'true');
        document.body.classList.remove('lightbox-open');
        lightboxImage.removeAttribute('src');
        if (lastFocus) lastFocus.focus();
      };

      const previous = () => {
        if (currentIndex > 0) {
          currentIndex -= 1;
          renderLightbox();
        }
      };

      const next = () => {
        if (currentIndex < galleryLinks.length - 1) {
          currentIndex += 1;
          renderLightbox();
        }
      };

      galleryLinks.forEach((link, index) => {
        link.addEventListener('click', (event) => {
          event.preventDefault();
          openLightbox(index);
        });
      });

      lightboxPrev.addEventListener('click', previous);
      lightboxNext.addEventListener('click', next);
      lightboxClose.addEventListener('click', closeLightbox);
      lightbox.addEventListener('click', (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      lightboxStage.addEventListener('touchstart', (event) => {
        touchStartX = event.changedTouches[0].clientX;
      }, { passive: true });
      lightboxStage.addEventListener('touchend', (event) => {
        const delta = event.changedTouches[0].clientX - touchStartX;
        if (Math.abs(delta) > 50) delta > 0 ? previous() : next();
      }, { passive: true });

      document.addEventListener('keydown', (event) => {
        if (!lightbox.hidden) {
          if (event.key === 'Escape') closeLightbox();
          if (event.key === 'ArrowLeft') previous();
          if (event.key === 'ArrowRight') next();
          if (event.key === 'Home') { currentIndex = 0; renderLightbox(); }
          if (event.key === 'End') { currentIndex = galleryLinks.length - 1; renderLightbox(); }
          return;
        }
        if (event.key === 'Escape') closeMenu();
      });
    })();
  </script>
</body>
</html>
