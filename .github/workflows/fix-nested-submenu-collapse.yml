name: Ajustar colapso de submenús móviles

on:
  push:
    paths:
      - '.github/workflows/fix-nested-submenu-collapse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Corregir apertura y cierre del submenú
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('assets/site-navigation.css')
          css = path.read_text(encoding='utf-8')

          old = '''  .unified-nav .nav-submenu{\n    display:grid!important;\n    grid-template-rows:0fr!important;\n    overflow:hidden!important;\n    opacity:0!important;\n    padding:0 0 0 18px!important;\n    border-left:1px solid rgba(181,53,42,.55)!important;\n    background:linear-gradient(90deg,rgba(181,53,42,.08),transparent 72%)!important;\n    transition:grid-template-rows .24s ease,opacity .18s ease,padding .24s ease!important;\n  }\n  .unified-nav .nav-submenu::before{\n    content:"";\n    display:block;\n    min-height:0;\n  }\n  .unified-nav .nav-item.submenu-open .nav-submenu{\n    grid-template-rows:1fr!important;\n    opacity:1!important;\n    padding-top:5px!important;\n    padding-bottom:9px!important;\n  }'''

          new = '''  .unified-nav .nav-submenu{\n    display:block!important;\n    max-height:0!important;\n    overflow:hidden!important;\n    visibility:hidden!important;\n    opacity:0!important;\n    padding:0 0 0 18px!important;\n    border-left:1px solid rgba(181,53,42,.55)!important;\n    background:linear-gradient(90deg,rgba(181,53,42,.08),transparent 72%)!important;\n    transition:max-height .24s ease,opacity .18s ease,padding .24s ease!important;\n  }\n  .unified-nav .nav-item.submenu-open .nav-submenu{\n    max-height:320px!important;\n    visibility:visible!important;\n    opacity:1!important;\n    padding-top:5px!important;\n    padding-bottom:9px!important;\n  }'''

          if old not in css:
              raise SystemExit('No se encontró el bloque de submenú esperado')
          css = css.replace(old, new, 1)
          path.write_text(css, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-navigation.css
          git commit -m "Corrige apertura de submenús móviles"
          git push origin main
