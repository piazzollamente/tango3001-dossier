name: Center trajectory captions
on:
  push:
    paths:
      - '.github/workflows/center-trajectory-captions.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Center image captions
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('trayectoria/index.html')
          s = p.read_text(encoding='utf-8')
          old = '''.visual-item figcaption,
.visual-single figcaption{
  margin-top:8px;
  color:#887970;
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:500;
  line-height:1.45;
  letter-spacing:.075em;
  text-transform:uppercase;
}'''
          new = '''.visual-item figcaption,
.visual-single figcaption{
  margin-top:8px;
  color:#887970;
  font-family:var(--font-sans);
  font-size:8px;
  font-weight:500;
  line-height:1.45;
  letter-spacing:.075em;
  text-transform:uppercase;
  text-align:center;
}'''
          if old not in s:
            raise SystemExit('caption block not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trayectoria/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Centra pies de imagen en Trayectoria"
          git push
