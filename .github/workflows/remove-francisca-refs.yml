name: Remove Francisca references
on:
  push:
    paths:
      - '.github/workflows/remove-francisca-refs.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove references from live site
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tangoparael3001/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('.cast img[alt="Francisca Cristopulos"]{object-position:center 18%}\n', '')
          s = s.replace('<h2 class="section-title">Dirección, escena e intérpretes</h2>', '<h2 class="section-title">Dirección artística e intérpretes</h2>')
          s = s.replace('      <article class="cast"><img src="../assets/francisca.jpg" alt="Francisca Cristopulos"><div><strong>Francisca Cristopulos</strong><span>Dirección escénica y dramatúrgica</span></div></article>\n', '')
          s = s.replace('<span style="color:rgba(244,234,220,.45);font-size:13px">Dirección: Valentina Galaz y Francisca Cristopulos</span>', '<span style="color:rgba(244,234,220,.45);font-size:13px">Dirección: Valentina Galaz</span>')
          p.write_text(s, encoding='utf-8')
          PY
          rm -f assets/francisca.jpg
      - name: Verify no public references remain
        run: |
          if grep -RniE 'Francisca|Cristopulos|francisca\.jpg' . \
            --exclude-dir=.git --exclude-dir=.github \
            --include='*.html' --include='*.css' --include='*.js' --include='*.json' --include='*.md' --include='*.txt'; then
            echo 'References remain in public/source files.'
            exit 1
          fi
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tangoparael3001/index.html assets/francisca.jpg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Elimina referencias a Francisca Cristopulos"
          git push
