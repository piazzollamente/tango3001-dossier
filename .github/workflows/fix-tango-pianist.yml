name: Fix Tango pianist
on:
  push:
    paths:
      - '.github/workflows/fix-tango-pianist.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace pianist name and photo
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tangoparael3001/index.html')
          s = p.read_text(encoding='utf-8')

          old_card = '<article class="cast"><img src="../assets/anahi-torres-piano.jpg" alt="Anahí Torres"><div><strong>Anahí Torres</strong><span>Piano</span></div></article>'
          new_card = '<article class="cast"><img src="../las4estaciones/piano-web.webp" alt="Valeria Chacón"><div><strong>Valeria Chacón</strong><span>Piano</span></div></article>'
          if old_card not in s:
              raise SystemExit('Pianist card not found')
          s = s.replace(old_card, new_card, 1)
          s = s.replace('.cast img[alt="Anahí Torres"]{object-position:center 18%}', '.cast img[alt="Valeria Chacón"]{object-position:center 24%}', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tangoparael3001/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Corrige pianista de Tango para el 3001"
          git push
