name: Aplicar contraste editorial Tango 3001

on:
  push:
    paths:
      - '.github/workflows/apply-tango-contrast-editorial.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Aplicar correcciones de contraste
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tangoparael3001/index.html')
          html = path.read_text(encoding='utf-8')
          marker = '/* CONTRASTE EDITORIAL 2026-08-25 */'
          if marker in html:
              raise SystemExit('La corrección ya está aplicada')

          css = r'''

/* CONTRASTE EDITORIAL 2026-08-25 */
/* Opción 2: jerarquía más marcada en secciones claras y viaje escénico. */
body:has(#programa) .section-paper .section-title {
  color: #211b1b !important;
  text-shadow: none !important;
}

body:has(#programa) .section-paper .lead,
body:has(#programa) #programa .work p {
  color: #625955 !important;
}

body:has(#programa) .section-paper .eyebrow {
  color: #74131b !important;
  border-color: rgba(116,19,27,.30) !important;
  background: rgba(116,19,27,.055) !important;
  box-shadow: none !important;
}

body:has(#programa) .section-paper .eyebrow::before {
  background: linear-gradient(90deg, #74131b, rgba(116,19,27,.08)) !important;
}

/* Programa: negro para contenido, vino para estructura, crema para categorías. */
body:has(#programa) #programa .work {
  border-top-color: rgba(116,19,27,.28) !important;
}

body:has(#programa) #programa .work-num {
  color: #7a171d !important;
  font-weight: 700 !important;
}

body:has(#programa) #programa .work h3 {
  color: #211b1b !important;
}

body:has(#programa) #programa .pill {
  background: #74131b !important;
  color: #fff7ed !important;
  border: 1px solid #74131b !important;
  box-shadow: none !important;
  font-weight: 700 !important;
  letter-spacing: .12em !important;
}

/* Viaje escénico: tarjetas oscuras como foco, con numeración dorada legible. */
body:has(#programa) .section-paper .grid-3 .card {
  border: 1px solid rgba(232,201,138,.46) !important;
  box-shadow: 0 20px 56px rgba(0,0,0,.24) !important;
}

body:has(#programa) .section-paper .grid-3 .card > small:first-child {
  display: inline-flex !important;
  align-items: center !important;
  justify-content: center !important;
  min-width: 48px !important;
  min-height: 30px !important;
  padding: 6px 12px !important;
  border: 1px solid rgba(242,214,154,.58) !important;
  border-radius: 999px !important;
  background: rgba(116,19,27,.24) !important;
  color: #f2d69a !important;
  font-weight: 700 !important;
  letter-spacing: .15em !important;
}

body:has(#programa) .section-paper .grid-3 .card h3 {
  color: #fff7ed !important;
}

body:has(#programa) .section-paper .grid-3 .card p {
  color: rgba(255,247,237,.84) !important;
}

@media (max-width: 640px) {
  body:has(#programa) #programa .work {
    border-top-color: rgba(116,19,27,.32) !important;
  }

  body:has(#programa) #programa .work p {
    color: #5d544f !important;
  }

  body:has(#programa) .section-paper .grid-3 .card > small:first-child {
    min-width: 44px !important;
    min-height: 28px !important;
    padding: 5px 11px !important;
  }
}
'''

          anchor = '</style>\n<link rel="stylesheet" href="/assets/site-navigation.css'
          if anchor not in html:
              raise SystemExit('No se encontró el cierre de estilos esperado')
          html = html.replace(anchor, css + '\n</style>\n<link rel="stylesheet" href="/assets/site-navigation.css', 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tangoparael3001/index.html
          git commit -m "Mejora contraste editorial en Tango para el 3001"
          git push origin main

# trigger 2026-08-25
