name: Corregir ancla de contacto del Home

on:
  push:
    paths:
      - '.github/workflows/fix-home-contact-anchor.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Añadir ancla al footer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'id="contacto" class="institutional-footer"' not in s:
              s = s.replace('<footer class="institutional-footer"', '<footer id="contacto" class="institutional-footer"', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Activa enlace Contacto del menú principal"
            git push origin main
          fi
