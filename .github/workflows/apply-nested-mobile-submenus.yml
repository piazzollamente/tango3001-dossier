name: Aplicar submenús desplegables del menú móvil

on:
  push:
    paths:
      - '.github/workflows/apply-nested-mobile-submenus.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Cargar navegación compartida en páginas públicas
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path('.').rglob('*.html'):
              html = path.read_text(encoding='utf-8')
              if '/assets/site-navigation.css' not in html:
                  continue

              original = html
              html = re.sub(
                  r'href="/assets/site-navigation\.css(?:\?v=[^"]*)?"',
                  'href="/assets/site-navigation.css?v=20260825-2"',
                  html,
                  count=1,
              )

              script = '<script defer src="/assets/site-navigation.js?v=20260825-1"></script>'
              if script not in html:
                  match = re.search(r'(<link rel="stylesheet" href="/assets/site-navigation\.css\?v=20260825-2"[^>]*>)', html)
                  if not match:
                      raise SystemExit(f'No se encontró el enlace de navegación en {path}')
                  html = html[:match.end()] + '\n' + script + html[match.end():]

              if html != original:
                  path.write_text(html, encoding='utf-8')
                  changed.append(str(path))

          if not changed:
              raise SystemExit('No hubo archivos HTML para actualizar')

          print('Actualizados:')
          print('\n'.join(changed))
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          git commit -m "Integra submenús desplegables en navegación móvil"
          git push origin main
