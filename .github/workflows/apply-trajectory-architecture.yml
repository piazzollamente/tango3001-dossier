name: Reorganizar Trayectoria y navegación

on:
  push:
    paths:
      - '.github/workflows/apply-trajectory-architecture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Reorganizar navegación y contenidos
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              Path('index.html'): 'home',
              Path('las4estaciones/index.html'): 'las4',
              Path('tangoparael3001/index.html'): 'tango',
              Path('registro-historico/index.html'): 'registro',
          }

          def nav_html(current):
              def a(label, href, key):
                  current_attr = ' aria-current="page"' if current == key else ''
                  return f'        <a href="{href}"{current_attr}>{label}</a>'
              return '\n'.join([
                  '      <div class="nav-primary" aria-label="Menú principal">',
                  a('Home', '/', 'home'),
                  a('Trayectoria', '/trayectoria/', 'trayectoria'),
                  a('Las 4 Estaciones', '/las4estaciones/', 'las4'),
                  a('Tango para el 3001', '/tangoparael3001/', 'tango'),
                  a('Dirección artística', '/direccion-artistica/', 'direccion'),
                  '      </div>'
              ])

          for path, current in pages.items():
              html = path.read_text(encoding='utf-8')
              html, count = re.subn(
                  r'\s*<div class="nav-primary" aria-label="Menú principal">.*?</div>',
                  '\n' + nav_html(current),
                  html,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'No se pudo actualizar nav-primary en {path}: {count}')
              html = html.replace('/assets/site-navigation.css?v=20260825-2', '/assets/site-navigation.css?v=20260825-3')
              html = html.replace('/assets/site-navigation.js?v=20260825-1', '/assets/site-navigation.js?v=20260825-2')
              path.write_text(html, encoding='utf-8')

          # Las 4 Estaciones: trayectoria sale del show y pasa a la sección global.
          path = Path('las4estaciones/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('<a class="text-link" href="#trayectoria">Conocer la trayectoria <span aria-hidden="true">↘</span></a>', '<a class="text-link" href="/trayectoria/">Conocer la trayectoria <span aria-hidden="true">↘</span></a>')
          html = html.replace('          <a href="#trayectoria">Trayectoria</a>\n', '')
          html, count = re.subn(r'\n\s*<section class="section trajectory" id="trayectoria">.*?</section>', '', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'No se encontró la sección trayectoria de Las 4 Estaciones: {count}')
          path.write_text(html, encoding='utf-8')

          # Tango 3001: retirar la biografía de dirección artística del show.
          path = Path('tangoparael3001/index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(
              r'(<article class="cast"><img src="\.\./assets/valentina-01\.jpg" alt="Valentina Galaz"><div><strong>Valentina Galaz</strong><span>Dirección artística · Flauta traversa</span>)<span style="[^"]*">.*?</span>(</div></article>)',
              r'\1\2',
              html,
              count=1,
              flags=re.S,
          )
          html, count = re.subn(
              r'\n\s*<!-- ══ TRAYECTORIA / PRENSA ══ -->\s*<section class="section">\s*<div class="container">\s*<div id="direccion-artistica" class="eyebrow">Dirección artística</div>.*?</section>',
              '',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'No se encontró la sección de dirección artística en Tango 3001: {count}')
          path.write_text(html, encoding='utf-8')

          # JS compartido: Trayectoria pasa a ser un menú desplegable global.
          js = Path('assets/site-navigation.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace("  const menus = {\n", "  const menus = {\n    '/trayectoria/': {\n      label: 'Trayectoria',\n      links: [\n        ['Trayectoria artística', '/trayectoria/'],\n        ['Registro histórico', '/registro-historico/']\n      ]\n    },\n")
          text = text.replace("        ['En vivo', '/las4estaciones/#envivo'],\n        ['Trayectoria', '/las4estaciones/#trayectoria']", "        ['En vivo', '/las4estaciones/#envivo']")
          text = text.replace("const submenuId = `nav-submenu-${navIndex}-${path.includes('las4') ? 'las4' : 'tango'}`;", "const submenuKey = path.includes('trayectoria') ? 'trayectoria' : (path.includes('las4') ? 'las4' : 'tango');\n        const submenuId = `nav-submenu-${navIndex}-${submenuKey}`;")
          js.write_text(text, encoding='utf-8')

          # Nueva página central de Trayectoria.
          Path('trayectoria/index.html').write_text(r'''<!DOCTYPE html>
