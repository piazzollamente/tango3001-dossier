<header class="hero"><div class="container"><p class="kicker">Dirección artística</p><h1>Valentina Galaz</h1></div></header>
<main class="container bio"><div class="photo"><img src="/assets/valentina-02.jpg" alt="Valentina Galaz"></div><div class="copy"><p>Flautista chilena, directora artística y creadora de proyectos donde la interpretación, la formación y la escena se cruzan con una mirada sensible, contemporánea y profundamente latinoamericana.</p><p>Desde 2021 dirige artísticamente <strong>Piazzollamente</strong>, agrupación dedicada a explorar la obra de Astor Piazzolla desde una lectura actual, escénica y expresiva. Su trabajo con el proyecto se ha presentado en el Teatro Regional Lucho Gatica, Sala SCD, Sala Master y el Festival Valparatango, con financiamiento del <strong>Ministerio de las Culturas de Chile</strong> e <strong>INAMU Argentina</strong>.</p><p>Su interés por Piazzolla nace desde una pregunta más profunda: cómo una música puede hablar del desarraigo, la migración, la ciudad, la memoria y la transformación. En su trabajo artístico ha buscado construir programas con sentido narrativo y abrir una forma de escucha donde la música no sea únicamente repertorio, sino experiencia.</p><p>Licenciada en Flauta Traversa por la Universidad Nacional de Cuyo (Argentina). Ha realizado estudios en la UNESP de Brasil, cursado la Cátedra Libre Astor Piazzolla en IUPA, y actualmente desarrolla una Maestría en Música Latinoamericana y una Diplomatura en Tango en la Universidad Nacional de San Martín.</p><p>Ha participado en estrenos, festivales y colaboraciones internacionales en <strong>Chile, Argentina, Paraguay, Brasil y Estados Unidos</strong>, incluyendo el Festival FEMUSC en Brasil y el Festival Darwin Vargas en Chile.</p><div class="hitos"><span>Teatro Regional Lucho Gatica</span><span>Sala SCD</span><span>Sala Master</span><span>Festival Valparatango</span><span>Ministerio de las Culturas</span><span>INAMU Argentina</span></div></div></main>
