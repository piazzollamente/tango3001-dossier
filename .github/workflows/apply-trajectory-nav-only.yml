name: Aplicar navegación de Trayectoria

on:
  push:
    paths:
      - '.github/workflows/apply-trajectory-nav-only.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Actualizar navegación y retirar duplicados
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          pages = {
              Path('index.html'): 'home',
              Path('las4estaciones/index.html'): 'las4',
              Path('tangoparael3001/index.html'): 'tango',
              Path('registro-historico/index.html'): 'registro',
          }

          def nav_html(current):
              links = [
                  ('Home', '/', 'home'),
                  ('Trayectoria', '/trayectoria/', 'trayectoria'),
                  ('Las 4 Estaciones', '/las4estaciones/', 'las4'),
                  ('Tango para el 3001', '/tangoparael3001/', 'tango'),
                  ('Dirección artística', '/direccion-artistica/', 'direccion'),
              ]
              rows = ['      <div class="nav-primary" aria-label="Menú principal">']
              for label, href, key in links:
                  current_attr = ' aria-current="page"' if current == key else ''
                  rows.append(f'        <a href="{href}"{current_attr}>{label}</a>')
              rows.append('      </div>')
              return '\n'.join(rows)

          for path, current in pages.items():
              html = path.read_text(encoding='utf-8')
              html, count = re.subn(
                  r'<div class="nav-primary" aria-label="Menú principal">.*?</div>',
                  nav_html(current),
                  html,
                  count=1,
                  flags=re.S,
              )
              if count != 1:
                  raise SystemExit(f'nav-primary no encontrado en {path}: {count}')
              html = html.replace('/assets/site-navigation.css?v=20260825-2', '/assets/site-navigation.css?v=20260825-3')
              html = html.replace('/assets/site-navigation.js?v=20260825-1', '/assets/site-navigation.js?v=20260825-2')
              path.write_text(html, encoding='utf-8')

          path = Path('las4estaciones/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('<a class="text-link" href="#trayectoria">Conocer la trayectoria <span aria-hidden="true">↘</span></a>', '<a class="text-link" href="/trayectoria/">Conocer la trayectoria <span aria-hidden="true">↘</span></a>')
          html = html.replace('          <a href="#trayectoria">Trayectoria</a>\n', '')
          html, count = re.subn(r'\n\s*<section class="section trajectory" id="trayectoria">.*?</section>', '', html, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Sección trayectoria de Las 4 Estaciones no encontrada: {count}')
          path.write_text(html, encoding='utf-8')

          path = Path('tangoparael3001/index.html')
          html = path.read_text(encoding='utf-8')
          html = re.sub(
              r'(<article class="cast"><img src="\.\./assets/valentina-01\.jpg" alt="Valentina Galaz"><div><strong>Valentina Galaz</strong><span>Dirección artística · Flauta traversa</span>)<span style="[^"]*">.*?</span>(</div></article>)',
              r'\1\2',
              html,
              count=1,
              flags=re.S,
          )
          html, count = re.subn(
              r'\n\s*<!-- ══ TRAYECTORIA / PRENSA ══ -->\s*<section class="section">\s*<div class="container">\s*<div id="direccion-artistica" class="eyebrow">Dirección artística</div>.*?</section>',
              '',
              html,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'Sección Dirección artística de Tango 3001 no encontrada: {count}')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html las4estaciones/index.html tangoparael3001/index.html registro-historico/index.html
          git commit -m "Integra Trayectoria en menú principal y retira duplicados"
          git push origin main
