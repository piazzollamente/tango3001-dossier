name: Reorder Tango cast
on:
  push:
    paths:
      - '.github/workflows/reorder-tango-cast.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reorder first cast cards
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tangoparael3001/index.html')
          s = p.read_text(encoding='utf-8')
          valentina = '      <article class="cast"><img src="../assets/valentina-01.jpg" alt="Valentina Galaz"><div><strong>Valentina Galaz</strong><span>Dirección artística · Flauta traversa</span></div></article>\n'
          marina = '      <article class="cast"><img src="../assets/marina-02.jpg" alt="Marina León"><div><strong>Marina León</strong><span>María</span></div></article>\n'
          valeria = '      <article class="cast"><img src="../las4estaciones/piano-web.webp" alt="Valeria Chacón"><div><strong>Valeria Chacón</strong><span>Piano</span></div></article>\n'
          for block in (valentina, marina, valeria):
              if block not in s:
                  raise SystemExit('Required cast card not found')
          s = s.replace(valentina, '', 1).replace(marina, '', 1).replace(valeria, '', 1)
          marker = '    <div class="cast-grid">\n'
          if marker not in s:
              raise SystemExit('Cast grid marker not found')
          s = s.replace(marker, marker + valentina + valeria + marina, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify order
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('tangoparael3001/index.html').read_text(encoding='utf-8')
          section = s.split('<div class="cast-grid">',1)[1].split('</div>\n  </div>\n</section>',1)[0]
          names = [section.find('Valentina Galaz'), section.find('Valeria Chacón'), section.find('Marina León')]
          if not (names[0] < names[1] < names[2]):
              raise SystemExit('Incorrect order')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tangoparael3001/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Reordena presentación del equipo artístico"
          git push
