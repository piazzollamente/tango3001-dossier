name: Retirar espacio escénico e información técnica

on:
  push:
    paths:
      - '.github/workflows/remove-tango-scenic-tech.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Retirar secciones y enlace de menú
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tangoparael3001/index.html')
          html = path.read_text(encoding='utf-8')

          # Retira Info técnica del submenú interno.
          html = html.replace('          <a href="#tecnico">Info técnica</a>\n', '')

          # Retira por completo la sección "El espacio como dramaturgia".
          html, n1 = re.subn(
              r'\n<!-- ══ SOBRE PIAZZOLLAMENTE ══ -->\n<!-- ══ ESCENAS / ESPACIALIDAD ══ -->\n<section class="section">.*?</section>\n\n<!-- ══ FICHA TÉCNICA ══ -->',
              '\n<!-- ══ SOBRE PIAZZOLLAMENTE ══ -->\n',
              html,
              count=1,
              flags=re.S,
          )

          # Retira por completo la sección de Información técnica.
          html, n2 = re.subn(
              r'\n<section id="tecnico" class="section section-paper">.*?</section>\n\n<footer id="contacto"',
              '\n<footer id="contacto"',
              html,
              count=1,
              flags=re.S,
          )

          if n1 != 1:
              raise SystemExit(f'No se pudo identificar de forma única la sección de espacio escénico: {n1}')
          if n2 != 1:
              raise SystemExit(f'No se pudo identificar de forma única la sección técnica: {n2}')

          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tangoparael3001/index.html
          git commit -m "Retira espacio escénico e información técnica de Tango 3001"
          git push origin main
