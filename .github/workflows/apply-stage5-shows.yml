name: Aplicar etapa 5 del Home

on:
  push:
    branches: [main]
    paths:
      - 'stage5-shows-trigger.txt'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar presentación de los dos espectáculos
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          if '/assets/home-stage5.css' not in s:
              s = s.replace('<link rel="stylesheet" href="/assets/home-stage4.css">', '<link rel="stylesheet" href="/assets/home-stage4.css">\n<link rel="stylesheet" href="/assets/home-stage5.css">', 1)

          start = s.index('<section class="spectacles" id="espectaculos">')
          end = s.index('<section class="identity" id="piazzollamente-hoy">', start)

          new_section = '''<section class="spectacles" id="espectaculos">
  <div class="container">
    <div class="section-head">
      <p class="kicker">Espectáculos</p>
      <div>
        <h2 class="section-title">Dos formas de entrar a Piazzollamente.</h2>
        <p class="lead">Un concierto instrumental y un espectáculo escénico-musical: dos experiencias autónomas construidas desde la música de Astor Piazzolla.</p>
      </div>
    </div>

    <div class="show-grid">
      <article class="show-card show-card-las4">
        <a class="show-media-link" href="/las4estaciones/" aria-label="Ver Las 4 Estaciones Porteñas">
          <img src="/las4estaciones/quinteto-publico.jpg" alt="Piazzollamente interpretando Las 4 Estaciones Porteñas" loading="lazy">
          <div class="show-media-topline"><span class="show-number">01</span><span class="show-format">Concierto instrumental</span></div>
        </a>
        <div class="show-body">
          <div class="show-facts"><span>60 min</span><span>5 intérpretes</span><span>Quinteto</span></div>
          <h3>Las 4 Estaciones Porteñas</h3>
          <p class="show-description">Un viaje a Buenos Aires a través de las Estaciones Porteñas y otras obras de Astor Piazzolla, desde una formación donde la flauta transforma el centro tímbrico del quinteto.</p>
          <p class="show-concept">Buenos Aires como una ciudad viva, cambiante y contradictoria.</p>
          <div class="show-actions"><a class="btn btn-red" href="/las4estaciones/">Ver Las 4 Estaciones</a><a class="show-secondary-link" href="#escuchar">Escuchar registro en vivo →</a></div>
        </div>
      </article>

      <article class="show-card show-card-tango tango">
        <a class="show-media-link" href="/tangoparael3001/" aria-label="Ver Tango para el 3001">
          <img src="/assets/escena-encuentro.jpeg" alt="Escena de Tango para el 3001" loading="lazy">
          <div class="show-media-topline"><span class="show-number">02</span><span class="show-format">Música · voces · escena</span></div>
        </a>
        <div class="show-body">
          <div class="show-facts"><span>60 min</span><span>Sin texto hablado</span><span>Piazzolla + Ferrer</span></div>
          <h3>Tango para el 3001</h3>
          <p class="show-description">La música de Astor Piazzolla y la poesía de Horacio Ferrer construyen una dramaturgia a través de voces, cuerpos, luz, objetos y espacio, sin recurrir al texto hablado.</p>
          <p class="show-concept">La ciudad convertida en escena y transformación.</p>
          <div class="show-actions"><a class="btn btn-gold" href="/tangoparael3001/">Ver Tango para el 3001</a><a class="show-secondary-link" href="/programacion/">Información para programación →</a></div>
        </div>
      </article>
    </div>
  </div>
</section>

'''
          s = s[:start] + new_section + s[end:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name 'piazzollamente'
          git config user.email 'valen.galaz@gmail.com'
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Etapa 5: jerarquiza los dos espectáculos en el Home'
          git push
