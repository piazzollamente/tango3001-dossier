name: Actualizar relato del quinteto Las 4 Estaciones

on:
  push:
    paths:
      - '.github/workflows/update-las4-quinteto-copy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Actualizar texto y retirar lista instrumental
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('las4estaciones/index.html')
          html = path.read_text(encoding='utf-8')

          old = '''        <div class="section-heading split-heading">
          <div>
            <p class="section-label">El quinteto</p>
            <h2>Otra respiración para esta música.</h2>
          </div>
          <p>Piazzollamente trabaja la música de Piazzolla desde una formación en la que la flauta traversa desplaza el centro tímbrico hacia otra respiración, otra articulación y otra forma de frasear, en diálogo con violín, guitarra eléctrica, piano y contrabajo.</p>
        </div>

        <div class="instrument-list" aria-label="Formación instrumental">
          <span>Flauta traversa</span>
          <span>Violín</span>
          <span>Guitarra eléctrica</span>
          <span>Piano</span>
          <span>Contrabajo</span>
        </div>
'''

          new = '''        <div class="section-heading split-heading">
          <div>
            <p class="section-label">El quinteto</p>
            <h2>El sonido de Piazzollamente en formato instrumental.</h2>
          </div>
          <p>Piazzollamente reúne intérpretes de sólida trayectoria cuya experiencia, sensibilidad y rigor construyen un lenguaje común. En <em>Las 4 Estaciones Porteñas</em>, ese trabajo colectivo toma forma como concierto instrumental: la flauta aporta una identidad tímbrica particular, pero el sonido nace del diálogo, la escucha y la personalidad musical de todo el quinteto.</p>
        </div>
'''

          if old not in html:
              raise SystemExit('No se encontró el bloque exacto del quinteto')

          html = html.replace(old, new, 1)
          path.write_text(html, encoding='utf-8')
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add las4estaciones/index.html
          git commit -m "Alinea relato del quinteto con el Home"
          git push origin main
