name: Force compact trajectory grid
on:
  push:
    paths:
      - '.github/workflows/force-compact-trajectory-grid.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force compact mobile grid
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('trayectoria/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* trajectory-compact-grid-force-v3 */'
          css = r'''
          /* trajectory-compact-grid-force-v3 */
          @media(max-width:700px){
            section.visual-group,
            section.visual-group.three,
            section.visual-group.four{
              display:grid!important;
              grid-template-columns:repeat(2,minmax(0,1fr))!important;
              width:calc(100% - 24px)!important;
              max-width:none!important;
              gap:16px 10px!important;
              align-items:start!important;
              margin:38px auto 46px!important;
            }
            section.visual-group > figure.visual-item{
              width:auto!important;
              min-width:0!important;
              max-width:none!important;
              margin:0!important;
            }
            section.visual-group .visual-frame{
              display:flex!important;
              width:100%!important;
              height:190px!important;
              min-height:190px!important;
              align-items:center!important;
              justify-content:center!important;
              overflow:hidden!important;
            }
            section.visual-group .visual-frame img,
            section.visual-group .visual-item.photo .visual-frame img,
            section.visual-group.four .visual-frame img{
              width:100%!important;
              height:100%!important;
              max-width:100%!important;
              max-height:100%!important;
              object-fit:contain!important;
              object-position:center!important;
            }
            section.visual-group .visual-item figcaption{
              display:block!important;
              margin-top:6px!important;
              min-height:2.8em!important;
              font-size:7px!important;
              line-height:1.35!important;
              letter-spacing:.055em!important;
            }
          }
          @media(max-width:430px){
            section.visual-group,
            section.visual-group.three,
            section.visual-group.four{
              grid-template-columns:repeat(2,minmax(0,1fr))!important;
              gap:14px 8px!important;
              width:calc(100% - 20px)!important;
            }
            section.visual-group .visual-frame{
              height:172px!important;
              min-height:172px!important;
            }
            section.visual-group .visual-item figcaption{
              font-size:6.7px!important;
            }
          }
          '''
          if marker not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit compact grid
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trayectoria/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Fuerza grilla compacta 2x2 en trayectoria móvil"
          git push
