name: Refrescar navegación unificada

on:
  push:
    paths:
      - '.github/workflows/apply-unified-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Forzar versión nueva de navegación
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260828-6'
          changed = []

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(
                  r'/assets/site-navigation\.css(?:\?v=[^"\']+)?',
                  f'/assets/site-navigation.css?v={VERSION}',
                  text
              )
              text = re.sub(
                  r'/assets/site-navigation\.js(?:\?v=[^"\']+)?',
                  f'/assets/site-navigation.js?v={VERSION}',
                  text
              )

              if 'unified-nav' in text and '/assets/site-navigation.css' not in text:
                  text = text.replace('</head>', f'<link rel="stylesheet" href="/assets/site-navigation.css?v={VERSION}">\n</head>', 1)
              if 'unified-nav' in text and '/assets/site-navigation.js' not in text:
                  text = text.replace('</head>', f'<script defer src="/assets/site-navigation.js?v={VERSION}"></script>\n</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Archivos actualizados:')
          for item in changed:
              print(' -', item)
          PY

      - name: Publicar refresco
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Refresca caché de navegación global"
            git push origin main
          fi
