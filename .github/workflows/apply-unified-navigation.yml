name: Refrescar navegación unificada

on:
  push:
    paths:
      - '.github/workflows/apply-unified-navigation.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Actualizar navegación y versiones de assets
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          VERSION = '20260828-8'
          GALLERY_VERSION = 'gallery-20260828-editorial-1'
          changed = []

          css_path = Path('assets/site-navigation.css')
          css = css_path.read_text(encoding='utf-8')
          marker_start = '/* DESKTOP-SUBMENU-INDICATORS:START */'
          marker_end = '/* DESKTOP-SUBMENU-INDICATORS:END */'
          indicator_block = r'''
/* DESKTOP-SUBMENU-INDICATORS:START */
@media(min-width:901px){
  .unified-nav .nav-item-row{
    gap:6px!important;
  }

  .unified-nav .nav-item-row::after{
    content:"⌄";
    display:block;
    flex:0 0 auto;
    color:rgba(242,214,154,.62);
    font-family:Arial,sans-serif;
    font-size:13px;
    font-weight:400;
    line-height:1;
    transform:translateY(-1px) rotate(0deg);
    transform-origin:center;
    transition:color .16s ease,transform .16s ease;
    pointer-events:none;
  }

  .unified-nav .nav-item:hover .nav-item-row::after,
  .unified-nav .nav-item:focus-within .nav-item-row::after{
    color:#f2d69a;
    transform:translateY(1px) rotate(180deg);
  }
}
/* DESKTOP-SUBMENU-INDICATORS:END */
'''

          pattern = re.compile(
              re.escape(marker_start) + r'.*?' + re.escape(marker_end) + r'\n?',
              re.S
          )
          css_new = pattern.sub('', css).rstrip() + '\n\n' + indicator_block.strip() + '\n'
          if css_new != css:
              css_path.write_text(css_new, encoding='utf-8')
              changed.append(str(css_path))

          for path in Path('.').rglob('*.html'):
              if '.git' in path.parts:
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              text = re.sub(
                  r'/assets/site-navigation\.css(?:\?v=[^"\']+)?',
                  f'/assets/site-navigation.css?v={VERSION}',
                  text
              )
              text = re.sub(
                  r'/assets/site-navigation\.js(?:\?v=[^"\']+)?',
                  f'/assets/site-navigation.js?v={VERSION}',
                  text
              )

              if path.as_posix() == 'registro-historico/index.html':
                  text = re.sub(
                      r'href="style\.css(?:\?v=[^"]+)?"',
                      f'href="style.css?v={GALLERY_VERSION}"',
                      text
                  )

              if 'unified-nav' in text and '/assets/site-navigation.css' not in text:
                  text = text.replace('</head>', f'<link rel="stylesheet" href="/assets/site-navigation.css?v={VERSION}">\n</head>', 1)
              if 'unified-nav' in text and '/assets/site-navigation.js' not in text:
                  text = text.replace('</head>', f'<script defer src="/assets/site-navigation.js?v={VERSION}"></script>\n</head>', 1)

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(str(path))

          print('Archivos actualizados:')
          for item in changed:
              print(' -', item)
          PY

      - name: Publicar refresco
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/site-navigation.css '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Refresca assets de navegación y archivo visual"
            git push origin main
          fi
